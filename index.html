<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connections — Daily Word Puzzle</title>
<style>
  :root { --ink:#202124; --paper:#f7f7f5; --tile:#efefe9; --line:#d8d8d2; --muted:#666; }
  * { box-sizing:border-box }
  body { margin:0; background:var(--paper); color:var(--ink); font-family:Arial,Helvetica,sans-serif; }
  main { width:min(680px, calc(100% - 28px)); margin:34px auto 50px; }
  header { text-align:center; border-bottom:1px solid var(--line); padding-bottom:18px; margin-bottom:22px; }
  h1 { font-family:Georgia,serif; font-size:clamp(2rem,6vw,2.8rem); margin:0 0 8px; letter-spacing:-1px; }
  .sub { color:var(--muted); font-size:.96rem; margin:0; }
  .instructions { text-align:center; margin:20px 0 16px; font-size:.95rem; }
  .mistakes { text-align:center; color:var(--muted); font-size:.9rem; margin:0 0 14px; }
  .dots { display:inline-flex; gap:7px; vertical-align:middle; margin-left:5px; }
  .dot { width:9px; height:9px; border-radius:50%; background:#c9c9c2; display:inline-block; }
  .dot.used { background:#343434; }
  #solved { display:grid; gap:9px; margin-bottom:10px; }
  .solved-group { border-radius:9px; padding:13px 10px; text-align:center; animation:pop .2s ease-out; }
  .solved-group strong { display:block; font-size:.9rem; letter-spacing:.04em; margin-bottom:5px; }
  .solved-group span { font-size:.88rem; }
  @keyframes pop { from { transform:scale(.97); opacity:.5 } to { transform:scale(1); opacity:1 } }
  .tiles { display:grid; grid-template-columns:repeat(4,1fr); gap:9px; }
  .tile { min-height:76px; border:0; border-radius:8px; background:var(--tile); color:var(--ink); padding:8px 5px; font-size:clamp(.75rem,2.5vw,1rem); font-weight:750; letter-spacing:.025em; cursor:pointer; text-transform:uppercase; overflow-wrap:anywhere; transition:background .12s,transform .12s; }
  .tile:hover { background:#e4e4dc; }
  .tile:focus-visible, button:focus-visible { outline:3px solid #5576a8; outline-offset:2px; }
  .tile.selected { background:#5b5b5b; color:white; transform:translateY(-2px); }
  .tile:disabled { cursor:default; }
  .controls { display:flex; justify-content:center; gap:9px; margin:22px 0 14px; flex-wrap:wrap; }
  .control { border:1.5px solid var(--ink); border-radius:24px; background:transparent; padding:11px 19px; font-weight:700; font-size:.92rem; cursor:pointer; }
  .control.primary { background:var(--ink); color:white; }
  .control:disabled { opacity:.35; cursor:not-allowed; }
  #message { min-height:25px; text-align:center; font-size:.92rem; font-weight:650; margin:8px 0; }
  .win { text-align:center; padding:18px; background:#e6edcf; border-radius:10px; margin-top:15px; }
  .win h2 { margin:0 0 7px; font-family:Georgia,serif; }
  .hidden { display:none !important; }
  footer { color:var(--muted); text-align:center; font-size:.78rem; margin-top:25px; }
  @media(max-width:420px) { .tiles { gap:6px } .tile { min-height:66px; padding:6px 3px; border-radius:6px } }
</style>
</head>
<body>
<main>
  <header>
    <h1>Connections</h1>
    <p class="sub">My dear Alin, please find four groups of four words that share something in common.</p>
  </header>
  <p class="mistakes">Mistakes remaining: <strong id="remaining">4</strong> <span class="dots" id="dots" aria-label="four mistakes remaining"></span></p>
  <section id="solved" aria-live="polite"></section>
  <section class="tiles" id="tiles" aria-label="Word tiles"></section>
  <div class="controls">
    <button class="control" id="shuffle">Shuffle</button>
    <button class="control" id="deselect">Deselect all</button>
    <button class="control primary" id="submit" disabled>Submit</button>
  </div>
  <p id="message" role="status" aria-live="polite">Good luck!</p>
  <section id="win" class="win hidden">
    <h2 id="endTitle">Well done!</h2>
    <p id="endText"></p>
    <button class="control primary" id="newGame">Play again</button>
  </section>
  <footer>A fresh puzzle is ready whenever you are. No timer, just four chances.</footer>
</main>
<script>
(() => {
  const groups = [
    { name: "LOCATIONS WE'VE BEEN TO AT DATES", color: "#f4df9b", words: ["CEMETERY", "BURGER KING", "WANKING TREE", "TRANSPORT MUSEUM"] },
    { name: "STUFF WE BOUGHT EACH OTHER", color: "#b8d8c0", words: ["MEDICINE", "KTH BOTTLE", "LEGO", "PIZZA"] },
    { name: "ENGLISH WORDS YOU KNOW IN HUNGARIAN", color: "#b8cce8", words: ["RASPBERRY", "DICK", "YES", "CHILDE"] },
    { name: "THINGS WE MADE TOGETHER", color: "#c9b9df", words: ["ERNŐ", "BROWNIES", "A MESS", "KRUMPLIS TÉSZTA"] }
  ];
  const allWords = groups.flatMap((g, i) => g.words.map(word => ({ word, group: i })));
  let tiles = [], selected = [], solved = [], mistakes = 0, finished = false;

  const $ = id => document.getElementById(id);
  const shuffleArray = arr => {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  };
  function start() {
    tiles = shuffleArray(allWords);
    selected = []; solved = []; mistakes = 0; finished = false;
    $("win").classList.add("hidden");
    $("message").textContent = "Good luck!";
    render();
  }
  function render() {
    const remaining = 4 - mistakes;
    $("remaining").textContent = remaining;
    $("dots").innerHTML = Array.from({length:4}, (_,i) => `<span class="dot ${i < mistakes ? "used" : ""}"></span>`).join("");
    $("solved").innerHTML = solved.map(i => {
      const g = groups[i];
      return `<div class="solved-group" style="background:${g.color}"><strong>${g.name}</strong><span>${g.words.join(" · ")}</span></div>`;
    }).join("");
    $("tiles").innerHTML = "";
    tiles.filter(t => !solved.includes(t.group)).forEach(t => {
      const btn = document.createElement("button");
      btn.className = "tile" + (selected.includes(t.word) ? " selected" : "");
      btn.textContent = t.word;
      btn.setAttribute("aria-pressed", selected.includes(t.word));
      btn.disabled = finished;
      btn.addEventListener("click", () => toggle(t.word));
      $("tiles").appendChild(btn);
    });
    $("submit").disabled = selected.length !== 4 || finished;
    $("deselect").disabled = selected.length === 0 || finished;
    $("shuffle").disabled = finished;
  }
  function toggle(word) {
    if (finished) return;
    if (selected.includes(word)) selected = selected.filter(w => w !== word);
    else if (selected.length < 4) selected.push(word);
    $("message").textContent = selected.length === 4 ? "Ready to submit?" : `${selected.length} of 4 selected`;
    render();
  }
  function submit() {
    if (selected.length !== 4 || finished) return;
    const chosen = tiles.filter(t => selected.includes(t.word));
    const groupIds = [...new Set(chosen.map(t => t.group))];
    if (groupIds.length === 1) {
      const id = groupIds[0];
      solved.push(id);
      selected = [];
      $("message").textContent = "That's a match!";
      if (solved.length === 4) {
        finished = true;
        $("endTitle").textContent = "Perfect solve!";
        $("endText").textContent = `You found all four groups with ${mistakes} ${mistakes === 1 ? "mistake" : "mistakes"}.`;
        $("win").classList.remove("hidden");
      }
    } else {
      mistakes++;
      const oneAway = groupIds.length === 2 && chosen.some(t => groups[t.group].words.filter(w => selected.includes(w)).length === 3);
      $("message").textContent = oneAway ? "One away…" : "Not quite. Try another combination.";
      selected = [];
      if (mistakes >= 4) {
        finished = true;
        $("endTitle").textContent = "Good try!";
        $("endText").textContent = "The groups are shown below. Give it another go!";
        groups.forEach((g, i) => { if (!solved.includes(i)) solved.push(i); });
        $("win").classList.remove("hidden");
      }
    }
    render();
  }
  $("submit").addEventListener("click", submit);
  $("deselect").addEventListener("click", () => { selected = []; $("message").textContent = "Selection cleared."; render(); });
  $("shuffle").addEventListener("click", () => { tiles = shuffleArray(tiles); render(); });
  $("newGame").addEventListener("click", start);
  start();
})();
</script>
</body>
</html>
